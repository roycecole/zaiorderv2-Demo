# 以 GitHub Pages 部署 Demo 站台（Mock + Demo 模式，純靜態、零後端）。
# 需要在儲存庫設定：Settings → Pages → Build and deployment → Source 選「GitHub Actions」。
# 站台網址為 https://<帳號>.github.io/<儲存庫名稱>/，因此以儲存庫名稱作為子路徑（VITE_APP_BASE_PATH）。
# GitHub Pages 無法設定 SPA fallback 與回應標頭：以「複製 index.html 為 404.html」處理深層連結（07 §14.2）；
# 若不想使用 404 fallback，可改設 VITE_ROUTER_MODE=hash。
name: Deploy Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 建置 Demo（含型別檢查）
        env:
          VITE_APP_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:demo
      - name: SPA fallback 與 .nojekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
