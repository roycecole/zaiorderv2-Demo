# CI（07 §14.1）：型別、Lint、單元 / 元件測試、建置（Mock + Demo 與 HTTP）、首次載入 JS 預算、E2E。
# 工作樹的所有檢查都可在本機以同樣的指令重現（見 README）。
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 型別・Lint・單元測試・建置
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 型別檢查
        run: npm run typecheck
      - name: Lint（含分層依賴規則）
        run: npm run lint
      - name: 單元與元件測試
        run: npm test
      - name: 相依套件弱點（正式相依，high 以上）
        run: npm audit --omit=dev --audit-level=high
      - name: 建置（Mock + Demo）
        run: npm run build:demo
      - name: 建置（HTTP，非 Demo）
        env:
          VITE_DATA_SOURCE: http
          VITE_DEMO_MODE: 'false'
        run: npx vite build --outDir dist/http --emptyOutDir
      - name: 安裝 Chromium（量測用）
        run: npx playwright install --with-deps chromium
      - name: 首次載入 JS 預算（NFR-03：≤ 200 kB gzip）
        run: node scripts/measure-initial-js.mjs --dist dist/http --budget 200

  e2e:
    name: E2E（Chromium：桌面與手機）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright
        run: npx playwright test --project=desktop --project=mobile
      - name: 上傳報告與失敗時的 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # NFR-02 要求 Safari 與 Firefox 通過冒煙測試。尚未納入必要檢查：先以不阻擋的方式累積訊號，穩定後再改為必要。
  e2e-cross-browser:
    name: E2E 冒煙（WebKit・Firefox，不阻擋）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit firefox
      - name: Playwright（跨瀏覽器冒煙）
        env:
          E2E_CROSS_BROWSER: '1'
        run: >-
          npx playwright test e2e/smoke.spec.ts e2e/quick-pickup.spec.ts e2e/csp.spec.ts e2e/keyboard-only.spec.ts
          --project=webkit --project=firefox
      - name: 上傳報告與失敗時的 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-cross-browser
          path: |
            playwright-report/
            test-results/
          retention-days: 7
